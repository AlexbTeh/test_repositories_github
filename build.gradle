plugins {
    id "com.android.application" version "8.4.2" apply false
    id "com.android.library" version "8.4.2" apply false

    id "org.jetbrains.kotlin.android" version "2.0.21" apply false
    id "org.jetbrains.kotlin.plugin.serialization" version "2.0.21" apply false

    // ✅ Compose compiler for Kotlin 2.0.x
    id "org.jetbrains.kotlin.plugin.compose" version "2.0.21" apply false

    id "com.google.devtools.ksp" version "2.0.21-1.0.26" apply false
}


ext {
    // SDK
    android_compile_sdk_version = 34
    android_min_sdk_version = 29
    android_target_sdk_version = 34
    jvm_extension = "17"

    // Coroutines
    coroutines_version = "1.8.1"
    kotlinx_coroutines_android = "org.jetbrains.kotlinx:kotlinx-coroutines-android:${coroutines_version}"

    // Room
    room_version = "2.6.1"
    room_runtime  = "androidx.room:room-runtime:${room_version}"
    room_ktx      = "androidx.room:room-ktx:${room_version}"
    room_compiler = "androidx.room:room-compiler:${room_version}"

    // ✅ AndroidX (держим совместимо с compileSdk 34 / AGP 8.4.2)
    // ВАЖНО: НЕ 1.16.0!
    androidx_core_ktx   = "androidx.core:core-ktx:1.13.1"
    androidx_core       = "androidx.core:core:1.13.1"


    androidx_appcompat  = "androidx.appcompat:appcompat:1.7.0"
    androidx_fragment   = "androidx.fragment:fragment-ktx:1.8.2"
    androidx_browser    = "androidx.browser:browser:1.8.0"
    androidx_datastore  = "androidx.datastore:datastore-preferences:1.1.1"
    androidx_lifecycle_service = "androidx.lifecycle:lifecycle-service:2.8.4"
    lifecycle_runtime_compose = "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"

    // Material / Flexbox / Location
    android_material = "com.google.android.material:material:1.12.0"
    google_flexbox = "com.google.android.flexbox:flexbox:3.0.0"
    play_services_location = "com.google.android.gms:play-services-location:21.3.0"

    // Compose BOM (оставляем)
    compose_bom = "androidx.compose:compose-bom:2024.06.00"
    compose_ui = "androidx.compose.ui:ui"
    compose_tooling_preview = "androidx.compose.ui:ui-tooling-preview"
    compose_tooling = "androidx.compose.ui:ui-tooling"
    compose_test_manifest = "androidx.compose.ui:ui-test-manifest"
    compose_material3 = "androidx.compose.material3:material3"
    compose_navigation = "androidx.navigation:navigation-compose:2.7.7"
    compose_constraintlayout = "androidx.constraintlayout:constraintlayout-compose:1.0.1"

    // Koin
    koin_bom = "3.5.6"

    // CameraX / MediaPipe
    camerax_version = "1.3.4"
    camerax_core = "androidx.camera:camera-core:${camerax_version}"
    camerax_camera2 = "androidx.camera:camera-camera2:${camerax_version}"
    camerax_lifecycle = "androidx.camera:camera-lifecycle:${camerax_version}"
    camerax_view = "androidx.camera:camera-view:${camerax_version}"
    mediapipe_tasks_vision = "com.google.mediapipe:tasks-vision:0.10.14"

    // Utils
    gson = "com.google.code.gson:gson:2.11.0"
    coil = "io.coil-kt:coil-compose:2.6.0"
    timber = "com.jakewharton.timber:timber:5.0.1"
    picasso = "com.squareup.picasso:picasso:2.8"

    // ✅ Ktor + datetime (в одном месте)
    ktor_version = "2.3.12"
    ktor_client_core = "io.ktor:ktor-client-core:${ktor_version}"
    ktor_client_okhttp = "io.ktor:ktor-client-okhttp:${ktor_version}"
    ktor_client_content_negotiation = "io.ktor:ktor-client-content-negotiation:${ktor_version}"
    ktor_serialization_json = "io.ktor:ktor-serialization-kotlinx-json:${ktor_version}"
    ktor_client_logging = "io.ktor:ktor-client-logging:${ktor_version}"
    ktor_client_auth = "io.ktor:ktor-client-auth:${ktor_version}"

    kotlinx_datetime = "org.jetbrains.kotlinx:kotlinx-datetime:0.5.0"

    // Test
    junit_lib = "junit:junit:4.13.2"
    androidx_test_core_ktx = "androidx.test:core-ktx:1.6.1"
    androidx_test_uiautomator = "androidx.test.uiautomator:uiautomator:2.3.0"
    androidx_test_runner = "androidx.test:runner:1.6.2"
    espresso_core = "androidx.test.espresso:espresso-core:3.6.1"
}
