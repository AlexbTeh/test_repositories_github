import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'kotlin-parcelize'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

def loadProps(String fileName) {
    def props = new Properties()
    def f = rootProject.file(fileName)
    if (f.exists()) {
        f.withInputStream { props.load(it) }
    }
    return props
}

def signingProps = loadProps("signing.properties")
def versionProps = loadProps("version.properties")

def major = (versionProps.getProperty("majorVersion", "1") as int)
def minor = (versionProps.getProperty("minorVersion", "0") as int)
def patch = (versionProps.getProperty("patchVersion", "0") as int)
def versionSuffix = versionProps.getProperty("versionSuffix", "")

android {
    namespace 'com.done.weather'
    compileSdk rootProject.ext.android_compile_sdk_version

    defaultConfig {
        applicationId "com.done.weather"
        minSdk rootProject.ext.android_min_sdk_version
        targetSdk rootProject.ext.android_target_sdk_version

        versionCode 10000 * major + 100 * minor + patch
        versionName "${major}.${minor}.${patch}"
        if (versionSuffix != null && !versionSuffix.trim().isEmpty()) {
            versionNameSuffix versionSuffix
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables { useSupportLibrary true }

        buildConfigField("String", "BASE_URL", "\"https://ausapi.verifeye.info/\"")
    }

    signingConfigs {
        release {
            def keystoreFile = signingProps.getProperty("KEYSTORE_FILE", "")
            def keystorePassword = signingProps.getProperty("KEYSTORE_PASSWORD", "")
            def keyAliasValue = signingProps.getProperty("KEY_ALIAS", "")

            if (keystoreFile != null && !keystoreFile.trim().isEmpty()) {
                storeFile file(keystoreFile)
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keystorePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
            versionNameSuffix "-debug"
            applicationIdSuffix ".debug"
        }
    }

    lint { disable 'ExpiredTargetSdkVersion' }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = rootProject.ext.jvm_extension }

    buildFeatures {
        buildConfig true
        viewBinding true
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = rootProject.ext.kotlin_compiler_extension
    }

    packaging {
        resources { excludes += ["/META-INF/{AL2.0,LGPL2.1}"] }
    }

    testOptions {
        unitTests.includeAndroidResources = true
        animationsDisabled = false
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "vgps_${variant.versionName}_${variant.versionCode}.apk"
        }
    }
}

